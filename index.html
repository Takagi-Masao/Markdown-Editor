<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes" />
    <title>Markdown 编辑器</title>

    <!-- KaTeX 样式 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css" />
    <!-- highlight.js 代码高亮主题 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/github.min.css" />
    <!-- 自定义样式 -->
    <link rel="stylesheet" href="./css/base.css" />
    <link rel="stylesheet" href="./css/toolbar.css" />
    <link rel="stylesheet" href="./css/editor.css" />
    <link rel="stylesheet" href="./css/preview.css" />
    <link rel="stylesheet" href="./css/statusbar.css" />
    <link rel="stylesheet" href="./css/modal.css" />
    <link rel="stylesheet" href="./css/responsive.css" />
    <link rel="stylesheet" href="./css/print.css" />
</head>
<body>

    <div id="app">
        <div class="toolbar">
            <span class="toolbar-title">📝 Markdown 编辑器</span>
            <div class="toolbar-actions">
                <a class="btn btn-github" href="https://github.com/Takagi-Masao/Markdown-Editor" target="_blank" rel="noopener noreferrer" title="查看本项目 GitHub 仓库">
                    <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
                        <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0016 8c0-4.42-3.58-8-8-8z"/>
                    </svg>
                    本项目地址
                </a>

                <span class="divider"></span>

                <button class="btn btn-outline" @click="openFile" title="打开 Markdown 文件（Ctrl+Shift+O）">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
                        <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z" />
                    </svg>
                    打开
                </button>

                <span class="divider"></span>

                <button class="btn btn-outline" @click="insertBold" title="加粗（Ctrl+B）">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
                        <path d="M6 4h8a4 4 0 0 1 4 4 4 4 0 0 1-4 4H6z" />
                        <path d="M6 12h9a4 4 0 0 1 4 4 4 4 0 0 1-4 4H6z" />
                    </svg>
                    加粗
                </button>
                <button class="btn btn-outline" @click="insertItalic" title="斜体（Ctrl+I）">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
                        <line x1="19" y1="4" x2="10" y2="4" />
                        <line x1="14" y1="20" x2="5" y2="20" />
                        <line x1="15" y1="4" x2="9" y2="20" />
                    </svg>
                    斜体
                </button>
                <button class="btn btn-outline" @click="insertCode" title="行内代码">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="16 18 22 12 16 6" />
                        <polyline points="8 6 2 12 8 18" />
                    </svg>
                    行内代码
                </button>

                <button class="btn btn-outline" @click="toggleWrap" :class="{ 'btn-active': wrapEnabled }" :title="wrapEnabled ? '自动换行已开启，点击关闭' : '自动换行已关闭（行号与当前行高亮更精确），点击开启'">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M4 7h16" />
                        <path d="M4 12h16" />
                        <path d="M4 17h9" />
                        <path d="M16 17l2 2 3-4" />
                    </svg>
                    自动换行
                </button>

                <button class="btn btn-outline" @click="openPrintSettings" title="设置打印页眉页脚">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M6 9V2h12v7" />
                        <path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2" />
                        <rect x="6" y="14" width="12" height="8" />
                    </svg>
                    打印设置
                </button>

                <span class="divider"></span>

                <button class="btn btn-export" @click="saveFile" title="保存 Markdown（Ctrl+S）">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
                        <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z" />
                        <polyline points="17 21 17 13 7 13 7 21" />
                        <polyline points="7 3 7 8 15 8" />
                    </svg>
                    保存 Markdown
                </button>
                <button class="btn btn-export" @click="exportPDF" title="导出 PDF（Ctrl+Shift+E）">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
                        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8l-6-6z" />
                        <path d="M14 2v6h6" />
                        <path d="M12 18v-6" />
                        <path d="M8 18v-2" />
                        <path d="M16 18v-4" />
                    </svg>
                    导出 PDF
                </button>

                <!-- 隐藏的文件输入 -->
                <input
                    type="file"
                    ref="fileInput"
                    style="display: none;"
                    accept=".md,.txt,.markdown"
                    @change="handleFileChange"
                />
            </div>
        </div>

        <div class="editor-main">
            <div class="editor-pane">
                <div class="pane-header">✏️ 编辑</div>
                <div class="editor-body">
                    <div class="editor-wrap">
                        <div class="editor-mirror" ref="mirrorRef" aria-hidden="true"></div>
                        <div class="line-highlight" ref="lineHighlightRef" aria-hidden="true"></div>
                        <textarea
                            ref="textareaRef"
                            v-model="markdownContent"
                            :wrap="wrapEnabled ? 'soft' : 'off'"
                            placeholder="在此输入 Markdown 内容……"
                            @input="onEditorInput"
                            @compositionstart="onEditorCompositionStart"
                            @compositionend="onEditorCompositionEnd"
                            @compositioncancel="onEditorCompositionCancel"
                            @keyup="updateCursorPos"
                            @click="updateCursorPos"
                            @select="updateCursorPos"
                        ></textarea>
                    </div>
                </div>
            </div>
            <div class="preview-pane">
                <div class="pane-header">👁️ 预览</div>
                <div
                    class="preview-content"
                    ref="previewRef"
                    v-html="renderedHtml"
                ></div>
            </div>
        </div>

        <!-- 状态栏 -->
        <div class="statusbar">
            <span class="status-item">{{ currentFileName || '未命名' }}<span v-if="isDirty" class="status-dirty"> ● 未保存</span></span>
            <span class="statusbar-spacer"></span>
            <span class="status-item">行 {{ cursorLine }}，列 {{ cursorCol }}</span>
            <span class="status-item">{{ lineCount }} 行</span>
            <span class="status-item">{{ charCount }} 字符</span>
        </div>

        <!-- 未保存修改确认弹窗 -->
        <div v-if="showUnsavedModal" class="modal-overlay" @click.self="handleUnsavedChoice(null)">
            <div class="modal">
                <p class="modal-text">当前文件有未保存的修改，是否保存后再打开新文件？</p>
                <div class="modal-actions">
                    <button class="btn btn-export" @click="handleUnsavedChoice(true)">保存</button>
                    <button class="btn btn-outline" @click="handleUnsavedChoice(false)">不保存</button>
                    <button class="btn btn-outline" @click="handleUnsavedChoice(null)">取消</button>
                </div>
            </div>
        </div>

        <!-- 打印页眉页脚设置弹窗 -->
        <div v-if="showPrintSettings" class="modal-overlay" @click.self="closePrintSettings">
            <div class="modal">
                <p class="modal-text">打印页眉页脚设置</p>
                <div class="print-settings">
                    <div class="setting-row">
                        <span class="setting-label">页眉</span>
                        <label><input type="checkbox" v-model="printSettings.showTime" /> 时间</label>
                        <label><input type="checkbox" v-model="printSettings.showTitle" /> 标题</label>
                    </div>
                    <input class="setting-input" v-model="printSettings.headerText" placeholder="自定义页眉文本（居中显示）" />
                    <div class="setting-row">
                        <span class="setting-label">页脚</span>
                        <label><input type="checkbox" v-model="printSettings.showUrl" /> 地址</label>
                    </div>
                    <input class="setting-input" v-model="printSettings.footerText" placeholder="自定义页脚文本（居中显示）" />
                    <p class="setting-hint">页码固定显示在页脚右侧。<strong>请务必在打印预览界面点击「更多设置」→「选项」，取消勾选「页眉和页脚」</strong>——浏览器自带的黑色时间/标题/网址/页码无法用代码关闭，不取消会与本页眉页脚重复。</p>
                </div>
                <div class="modal-actions">
                    <button class="btn btn-export" @click="closePrintSettings">确定</button>
                </div>
            </div>
        </div>
    </div>

    <!-- highlight.js -->
    <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>
    <!-- KaTeX 核心库 -->
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>

    <script type="importmap">
        {
            "imports": {
                "vue": "https://cdn.jsdelivr.net/npm/vue@3/dist/vue.esm-browser.js",
                "marked": "https://cdn.jsdelivr.net/npm/marked@12.0.2/lib/marked.esm.js"
            }
        }
    </script>

    <script type="module" src="./js/main.js"></script>
</body>
</html>
