<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes" />
    <title>Markdown 编辑器</title>

    <!-- KaTeX 样式 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css" />
    <!-- highlight.js 代码高亮主题 -->
    <link rel="stylesheet"
    href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/github.min.css" />
    <!-- 自定义样式 -->
    <link rel="stylesheet" href="./css/style.css" />
</head>
<body>

    <div id="app">
        <div class="toolbar">
            <span class="toolbar-title">📝 Markdown 编辑器</span>
            <div class="toolbar-actions">
                <button class="btn btn-outline" @click="insertBold" title="加粗 (Ctrl+B)">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
                        <path d="M6 4h8a4 4 0 0 1 4 4 4 4 0 0 1-4 4H6z" />
                        <path d="M6 12h9a4 4 0 0 1 4 4 4 4 0 0 1-4 4H6z" />
                    </svg>
                    加粗
                </button>
                <button class="btn btn-outline" @click="insertItalic" title="斜体 (Ctrl+I)">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
                        <line x1="19" y1="4" x2="10" y2="4" />
                        <line x1="14" y1="20" x2="5" y2="20" />
                        <line x1="15" y1="4" x2="9" y2="20" />
                    </svg>
                    斜体
                </button>
                <button class="btn btn-outline" @click="insertCode" title="行内代码">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="16 18 22 12 16 6" />
                        <polyline points="8 6 2 12 8 18" />
                    </svg>
                    行内代码
                </button>
                <span class="divider"></span>
                <button class="btn btn-export" @click="exportPDF">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
                        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8l-6-6z" />
                        <path d="M14 2v6h6" />
                        <path d="M12 18v-6" />
                        <path d="M8 18v-2" />
                        <path d="M16 18v-4" />
                    </svg>
                    导出 PDF
                </button>
            </div>
        </div>

        <div class="editor-main">
            <div class="editor-pane">
                <div class="pane-header">✏️ 编辑</div>
                <textarea
                    ref="textareaRef"
                    v-model="markdownContent"
                    placeholder="在此输入 Markdown 内容……"
                    @keydown="handleKeydown"
                ></textarea>
            </div>
            <div class="preview-pane">
                <div class="pane-header">👁️ 预览</div>
                <div
                    class="preview-content"
                    ref="previewRef"
                    v-html="renderedHtml"
                ></div>
            </div>
        </div>
    </div>

    <!-- highlight.js -->
    <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>
    <!-- KaTeX 核心库 -->
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>

    <script type="importmap">
        {
            "imports": {
                "vue": "https://cdn.jsdelivr.net/npm/vue@3/dist/vue.esm-browser.js",
                "marked": "https://cdn.jsdelivr.net/npm/marked@12.0.2/lib/marked.esm.js"
            }
        }
    </script>

    <script type="module" src="./js/main.js"></script>
</body>
</html>
