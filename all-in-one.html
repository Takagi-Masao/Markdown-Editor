<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes" />
    <title>Markdown 编辑器</title>

    <!-- KaTeX 样式 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css" />
    <!-- highlight.js 代码高亮主题 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/github.min.css" />

    <style>
        :root {
            --bg: #f5f7fa;
            --surface: #ffffff;
            --border: #e4e7ec;
            --text: #1a1a2e;
            --text-secondary: #6b7280;
            --accent: #2d7aff;
            --accent-hover: #1a5fd0;
            --toolbar-bg: #fafbfc;
            --editor-bg: #fefefe;
            --preview-bg: #ffffff;
            --shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
            --radius: 12px;
            --font-mono: 'SF Mono', 'Fira Code', 'Consolas', 'Monaco', 'Courier New', monospace;
            --font-sans: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            --transition: 0.2s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-sans);
            background: var(--bg);
            padding: 20px;
            height: 100vh;
            display: flex;
            flex-direction: column;
            color: var(--text);
            -webkit-font-smoothing: antialiased;
        }

        #app {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--surface);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            overflow: hidden;
            min-height: 0;
        }

        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
            background: var(--toolbar-bg);
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
            gap: 12px;
            flex-wrap: wrap;
        }

        .toolbar-title {
            font-weight: 600;
            font-size: 15px;
            color: var(--text);
            letter-spacing: -0.01em;
            white-space: nowrap;
        }

        .toolbar-actions {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all var(--transition);
            border: 1px solid transparent;
            white-space: nowrap;
            font-family: var(--font-sans);
            letter-spacing: 0.01em;
        }

        .btn-export {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
        }

        .btn-export:hover {
            background: var(--accent-hover);
            border-color: var(--accent-hover);
            box-shadow: 0 2px 8px rgba(45, 122, 255, 0.3);
        }

        .btn-outline {
            background: transparent;
            color: var(--text-secondary);
            border-color: var(--border);
        }

        .btn-outline:hover {
            background: #f3f4f6;
            border-color: #cbd5e1;
            color: var(--text);
        }

        .btn svg {
            flex-shrink: 0;
        }

        .divider {
            width: 1px;
            height: 22px;
            background: var(--border);
            margin: 0 4px;
            flex-shrink: 0;
        }

        .editor-main {
            flex: 1;
            display: flex;
            min-height: 0;
            position: relative;
        }

        .editor-pane {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
            border-right: 1px solid var(--border);
            background: var(--editor-bg);
        }

        .editor-pane .pane-header {
            padding: 8px 16px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: var(--text-secondary);
            background: #f9fafb;
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
            user-select: none;
        }

        .editor-pane textarea {
            flex: 1;
            width: 100%;
            border: none;
            outline: none;
            resize: none;
            padding: 20px;
            font-family: var(--font-mono);
            font-size: 14px;
            line-height: 1.7;
            color: var(--text);
            background: var(--editor-bg);
            tab-size: 2;
            -moz-tab-size: 2;
            min-height: 0;
        }

        .editor-pane textarea::placeholder {
            color: #c0c7cf;
        }

        .editor-pane textarea:focus {
            background: #fefefe;
        }

        .preview-pane {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
            background: var(--preview-bg);
        }

        .preview-pane .pane-header {
            padding: 8px 16px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: var(--text-secondary);
            background: #f9fafb;
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
            user-select: none;
        }

        .preview-content {
            flex: 1;
            overflow-y: auto;
            padding: 24px 28px;
            font-family: var(--font-sans);
            font-size: 15px;
            line-height: 1.75;
            color: #24292f;
            word-wrap: break-word;
        }

        /* Markdown 预览基础样式 */
        .preview-content h1,
        .preview-content h2,
        .preview-content h3,
        .preview-content h4,
        .preview-content h5,
        .preview-content h6 {
            margin-top: 1.5em;
            margin-bottom: 0.5em;
            font-weight: 600;
            line-height: 1.3;
            color: #1a1a2e;
        }
        .preview-content h1 { font-size: 1.8em; border-bottom: 1px solid #e8ecf1; padding-bottom: 0.3em; }
        .preview-content h2 { font-size: 1.45em; border-bottom: 1px solid #e8ecf1; padding-bottom: 0.25em; }
        .preview-content h3 { font-size: 1.2em; }
        .preview-content h4 { font-size: 1.05em; }
        .preview-content p { margin-bottom: 1em; }
        .preview-content a { color: var(--accent); text-decoration: none; }
        .preview-content a:hover { text-decoration: underline; }
        .preview-content strong { font-weight: 600; }

        .preview-content blockquote {
            margin: 1em 0;
            padding: 0.6em 1em;
            border-left: 4px solid #d0d7de;
            background: #f8f9fb;
            border-radius: 0 6px 6px 0;
            color: #57606a;
        }

        .preview-content blockquote p:last-child { margin-bottom: 0; }
        
        .preview-content code {
            font-family: var(--font-mono);
            font-size: 0.88em;
            background: #f3f4f6;
            padding: 0.15em 0.4em;
            border-radius: 4px;
            color: #d63384;
        }

        .preview-content pre {
            margin: 1em 0;
            padding: 16px 20px;
            background: #f6f8fa;
            border: 1px solid #e4e7ec;
            border-radius: 8px;
            overflow: auto;
            font-size: 13px;
            line-height: 1.55;
            max-height: 400px;
        }

        .preview-content pre code {
            background: transparent;
            padding: 0;
            color: inherit;
            font-size: inherit;
            border-radius: 0;
            white-space: pre;
        }

        .preview-content ul,
        .preview-content ol { margin: 0.8em 0; padding-left: 1.8em; }
        .preview-content li { margin-bottom: 0.3em; }
        .preview-content table { width: 100%; border-collapse: collapse; margin: 1em 0; font-size: 0.9em; }
        .preview-content th,
        .preview-content td { border: 1px solid #d0d7de; padding: 8px 14px; text-align: left; }
        .preview-content th { background: #f6f8fa; font-weight: 600; }
        .preview-content tr:nth-child(even) { background: #fafbfc; }
        .preview-content img { max-width: 100%; border-radius: 6px; }
        .preview-content hr { border: none; border-top: 2px solid #e4e7ec; margin: 1.5em 0; }
        .preview-content input[type="checkbox"] { margin-right: 0.4em; accent-color: var(--accent); }
        .preview-content .katex { font-size: 1.1em; }

        @media (max-width: 768px) {
            body { padding: 8px; }
            #app { border-radius: 8px; }
            .editor-main { flex-direction: column; }
            .editor-pane { border-right: none; border-bottom: 1px solid var(--border); flex: 1; min-height: 40%; max-height: 55%; }
            .preview-pane { flex: 1; min-height: 40%; }
            .preview-content { padding: 16px 18px; font-size: 14px; }
            .editor-pane textarea { padding: 14px 16px; font-size: 13px; }
            .toolbar { padding: 8px 12px; gap: 6px; }
            .btn { padding: 6px 12px; font-size: 12px; }
            .toolbar-title { font-size: 13px; }
            .divider { display: none; }
        }

        @media (max-width: 480px) {
            .toolbar { flex-direction: column; align-items: flex-start; gap: 6px; }
            .toolbar-actions { width: 100%; justify-content: flex-end; flex-wrap: wrap; }
            .btn-export { width: 100%; justify-content: center; }
            .btn-outline { font-size: 11px; padding: 5px 10px; }
            .divider { display: none; }
        }

        /* ========== 打印样式 ========== */
        @media print {
            @page {
                size: A4;
                margin: 18mm 16mm; /* 设置舒适边距 */
            }

            body {
                padding: 0 !important;
                margin: 0 !important;
                background: #fff !important;
                font-size: 13px;
                line-height: 1.6;
                display: block !important;
                height: auto !important;
                min-height: auto !important;
                overflow: visible !important;
            }

            #app {
                display: block !important;
                height: auto !important;
                min-height: auto !important;
                overflow: visible !important;
                box-shadow: none;
                border-radius: 0;
                background: #fff;
                padding: 0 !important;
            }

            .toolbar {
                display: none !important;
            }

            .editor-main {
                display: block !important;
                height: auto !important;
                overflow: visible !important;
            }

            .editor-pane {
                display: none !important;
            }

            .preview-pane {
                display: block !important;
                width: 100% !important;
                height: auto !important;
                overflow: visible !important;
                border: none !important;
            }

            .preview-pane .pane-header {
                display: none !important;
            }

            .preview-content {
                display: block !important;
                height: auto !important;
                max-height: none !important;
                overflow: visible !important;
                padding: 0 !important;
                margin: 0 !important;
                font-size: 13px;
                line-height: 1.65;
                color: #000;
            }

            .preview-content * {
                page-break-inside: auto;
            }

            .preview-content h1,
            .preview-content h2,
            .preview-content h3 {
                page-break-after: avoid;
            }

            .preview-content pre {
                max-height: none !important;
                height: auto !important;
                overflow: visible !important;
                white-space: pre-wrap !important;
                word-break: break-word !important;
                overflow-wrap: break-word !important;
                page-break-inside: auto !important;
                background: #f9f9f9 !important;
                border: 1px solid #ddd !important;
            }

            .preview-content pre code {
                white-space: pre-wrap !important;
                word-break: break-word !important;
                overflow-wrap: break-word !important;
            }

            .preview-content blockquote {
                background: #fafafa !important;
                border-left-color: #ccc !important;
            }

            .preview-content table {
                page-break-inside: avoid;
            }

            .preview-content a {
                color: #000;
                text-decoration: underline;
            }
        }
    </style>
</head>
<body>

    <div id="app">
        <div class="toolbar">
            <span class="toolbar-title">📝 Markdown 编辑器</span>
            <div class="toolbar-actions">
                <button class="btn btn-outline" @click="openFile" title="打开 Markdown 文件">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
                        <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z" />
                    </svg>
                    打开
                </button>
                <span class="divider"></span>
                <button class="btn btn-outline" @click="insertBold" title="加粗 (Ctrl+B)">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
                        <path d="M6 4h8a4 4 0 0 1 4 4 4 4 0 0 1-4 4H6z" />
                        <path d="M6 12h9a4 4 0 0 1 4 4 4 4 0 0 1-4 4H6z" />
                    </svg>
                    加粗
                </button>
                <button class="btn btn-outline" @click="insertItalic" title="斜体 (Ctrl+I)">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
                        <line x1="19" y1="4" x2="10" y2="4" />
                        <line x1="14" y1="20" x2="5" y2="20" />
                        <line x1="15" y1="4" x2="9" y2="20" />
                    </svg>
                    斜体
                </button>
                <button class="btn btn-outline" @click="insertCode" title="行内代码">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="16 18 22 12 16 6" />
                        <polyline points="8 6 2 12 8 18" />
                    </svg>
                    行内代码
                </button>
                <span class="divider"></span>
                <button class="btn btn-export" @click="exportPDF">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
                        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8l-6-6z" />
                        <path d="M14 2v6h6" />
                        <path d="M12 18v-6" />
                        <path d="M8 18v-2" />
                        <path d="M16 18v-4" />
                    </svg>
                    导出 PDF
                </button>

                <!-- 隐藏的文件输入 -->
                <input
                    type="file"
                    ref="fileInput"
                    style="display: none;"
                    accept=".md,.txt,.markdown"
                    @change="handleFileChange"
                />
            </div>
        </div>

        <div class="editor-main">
            <div class="editor-pane">
                <div class="pane-header">✏️ 编辑</div>
                <textarea
                    ref="textareaRef"
                    v-model="markdownContent"
                    placeholder="在此输入 Markdown 内容……"
                    @keydown="handleKeydown"
                ></textarea>
            </div>
            <div class="preview-pane">
                <div class="pane-header">👁️ 预览</div>
                <div
                    class="preview-content"
                    ref="previewRef"
                    v-html="renderedHtml"
                ></div>
            </div>
        </div>
    </div>

    <!-- highlight.js -->
    <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>
    <!-- KaTeX 核心库 -->
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>

    <script type="importmap">
        {
            "imports": {
                "vue": "https://cdn.jsdelivr.net/npm/vue@3/dist/vue.esm-browser.js",
                "marked": "https://cdn.jsdelivr.net/npm/marked@12.0.2/lib/marked.esm.js"
            }
        }
    </script>

    <script type="module">
        import { createApp, ref, computed, watch, nextTick, onMounted, onBeforeUnmount } from 'vue';
        import { marked } from 'marked';

        // 扩展 marked 支持 LaTeX
        const mathExtension = {
            extensions: [
                {
                    name: 'blockMath',
                    level: 'block',
                    start(src) { return src.match(/\$\$/)?.index; },
                    tokenizer(src) {
                        const match = src.match(/^\$\$(\n?.*?)\$\$/s);
                        if (match) {
                            return { type: 'blockMath', raw: match[0], text: match[1].trim() };
                        }
                    },
                    renderer(token) {
                        return `<div class="math block">${token.text}</div>`;
                    }
                },
                {
                    name: 'inlineMath',
                    level: 'inline',
                    start(src) { return src.match(/\$/)?.index; },
                    tokenizer(src) {
                        const match = src.match(/^\$([^\n$]+?)\$(?!\$)/);
                        if (match) {
                            return { type: 'inlineMath', raw: match[0], text: match[1].trim() };
                        }
                    },
                    renderer(token) {
                        return `<span class="math inline">${token.text}</span>`;
                    }
                }
            ]
        };

        marked.use(mathExtension);
        marked.setOptions({ breaks: true, gfm: true });

        const app = createApp({
            setup() {
                const markdownContent = ref(`# 欢迎使用 Markdown 编辑器

这是一段 **Markdown** 示例，你可以在这里尽情编辑。

## 功能特性
- 实时预览
- 工具栏支持
- 导出 PDF（点击右上角按钮）

$$
e^{i \\pi } + 1 = 0
$$

\`\`\`javascript
console.log('Hello, world!');
\`\`\`

> 生活不止眼前的苟且，还有诗和远方。

你可以在[这里](https://help.luogu.com.cn/rules/academic/handbook/latex "LaTeX 格式手册")或者[这里](https://help.luogu.com.cn/rules/academic/handbook/markdown "洛谷 Markdown 格式手册")学习更多关于 Markdown 的知识。
`);

                const textareaRef = ref(null);
                const previewRef = ref(null);
                const fileInput = ref(null);

                let onEditorScroll = null;
                let onPreviewScroll = null;

                const renderedHtml = computed(() => {
                    const raw = markdownContent.value;
                    if (!raw || raw.trim() === '') return '';
                    try {
                        return marked.parse(raw);
                    } catch (err) {
                        console.error('Markdown 解析错误:', err);
                        return `<p style="color:red;">Markdown 解析出错，请检查语法。</p>`;
                    }
                });

                function applyHighlight() {
                    if (!previewRef.value || !window.hljs) return;
                    const codeBlocks = previewRef.value.querySelectorAll('pre code');
                    codeBlocks.forEach((block) => {
                        if (!block.dataset.highlighted) {
                            try {
                                window.hljs.highlightElement(block);
                                block.dataset.highlighted = 'true';
                            } catch (e) { console.warn('代码高亮失败:', e); }
                        }
                    });
                }

                function renderMathElements() {
                    if (!previewRef.value || !window.katex) return;
                    const inlines = previewRef.value.querySelectorAll('.math.inline');
                    inlines.forEach((el) => {
                        if (el.querySelector('.katex')) return;
                        try {
                            window.katex.render(el.textContent, el, { throwOnError: false, displayMode: false });
                        } catch (e) { console.warn('公式渲染失败:', el.textContent, e); }
                    });
                    const blocks = previewRef.value.querySelectorAll('.math.block');
                    blocks.forEach((el) => {
                        if (el.querySelector('.katex')) return;
                        try {
                            window.katex.render(el.textContent, el, { throwOnError: false, displayMode: true });
                        } catch (e) { console.warn('公式渲染失败:', el.textContent, e); }
                    });
                }

                // 绑定丝滑同步滚动
                function bindSyncScroll() {
                    const ta = textareaRef.value;
                    const preview = previewRef.value;
                    if (!ta || !preview) return;

                    if (onEditorScroll) ta.removeEventListener('scroll', onEditorScroll);
                    if (onPreviewScroll) preview.removeEventListener('scroll', onPreviewScroll);

                    onEditorScroll = () => {
                        preview.removeEventListener('scroll', onPreviewScroll);
                        const maxScrollTop = ta.scrollHeight - ta.clientHeight;
                        if (maxScrollTop <= 0) {
                            preview.addEventListener('scroll', onPreviewScroll);
                            return;
                        }
                        const ratio = ta.scrollTop / maxScrollTop;
                        const previewMax = preview.scrollHeight - preview.clientHeight;
                        preview.scrollTo({
                            top: ratio * Math.max(previewMax, 0),
                            behavior: 'instant'
                        });
                        preview.addEventListener('scroll', onPreviewScroll);
                    };

                    onPreviewScroll = () => {
                        ta.removeEventListener('scroll', onEditorScroll);
                        const maxScrollTop = preview.scrollHeight - preview.clientHeight;
                        if (maxScrollTop <= 0) {
                            ta.addEventListener('scroll', onEditorScroll);
                            return;
                        }
                        const ratio = preview.scrollTop / maxScrollTop;
                        const editorMax = ta.scrollHeight - ta.clientHeight;
                        ta.scrollTo({
                            top: ratio * Math.max(editorMax, 0),
                            behavior: 'instant'
                        });
                        ta.addEventListener('scroll', onEditorScroll);
                    };

                    ta.addEventListener('scroll', onEditorScroll);
                    preview.addEventListener('scroll', onPreviewScroll);
                }

                watch(renderedHtml, async () => {
                    await nextTick();
                    applyHighlight();
                    renderMathElements();
                    bindSyncScroll();
                });

                onMounted(async () => {
                    await nextTick();
                    applyHighlight();
                    renderMathElements();
                    bindSyncScroll();
                });

                onBeforeUnmount(() => {
                    const ta = textareaRef.value;
                    const preview = previewRef.value;
                    if (ta && onEditorScroll) ta.removeEventListener('scroll', onEditorScroll);
                    if (preview && onPreviewScroll) preview.removeEventListener('scroll', onPreviewScroll);
                });

                function loadFileContent(file) {
                    return new Promise((resolve, reject) => {
                        const reader = new FileReader();
                        reader.onload = () => resolve(reader.result);
                        reader.onerror = () => reject(new Error('文件读取失败'));
                        reader.readAsText(file, 'UTF-8');
                    });
                }

                const openFile = () => {
                    fileInput.value?.click();
                };

                const handleFileChange = async (event) => {
                    const file = event.target.files?.[0];
                    if (!file) return;

                    try {
                        const text = await loadFileContent(file);
                        markdownContent.value = text;
                    } catch (err) {
                        console.error('无法读取文件:', err);
                        alert('文件读取失败，请重试');
                    } finally {
                        // 清空选择，使重新选择同一文件也能触发 change
                        event.target.value = '';
                    }
                }

                function getTextarea() { return textareaRef.value; }

                function insertAroundSelection(before, after) {
                    const ta = getTextarea();
                    if (!ta) return;
                    const start = ta.selectionStart;
                    const end = ta.selectionEnd;
                    const selected = markdownContent.value.substring(start, end);
                    const replacement = before + selected + after;
                    markdownContent.value =
                        markdownContent.value.substring(0, start) + replacement + markdownContent.value.substring(end);
                    nextTick(() => {
                        ta.focus();
                        if (selected.length > 0) {
                            ta.setSelectionRange(start, start + replacement.length);
                        } else {
                            ta.setSelectionRange(start + before.length, start + before.length);
                        }
                    });
                }

                function insertAtCursor(text) {
                    const ta = getTextarea();
                    if (!ta) return;
                    const start = ta.selectionStart;
                    markdownContent.value =
                        markdownContent.value.substring(0, start) + text + markdownContent.value.substring(ta.selectionEnd);
                    nextTick(() => {
                        ta.focus();
                        const newPos = start + text.length;
                        ta.setSelectionRange(newPos, newPos);
                    });
                }

                const insertBold = () => insertAroundSelection('**', '**');
                const insertItalic = () => insertAroundSelection('*', '*');
                const insertCode = () => insertAroundSelection('`', '`');

                function handleKeydown(e) {
                    if (e.key === 'Tab' && !e.shiftKey) {
                        e.preventDefault();
                        insertAtCursor('  ');
                        return;
                    }
                    if ((e.ctrlKey || e.metaKey) && e.key === 'b') {
                        e.preventDefault();
                        insertBold();
                        return;
                    }
                    if ((e.ctrlKey || e.metaKey) && e.key === 'i') {
                        e.preventDefault();
                        insertItalic();
                        return;
                    }
                    if ((e.ctrlKey || e.metaKey) && e.key === 's') {
                        e.preventDefault();
                        exportPDF();
                        return;
                    }
                }

                const exportPDF = () => {
                    applyHighlight();
                    renderMathElements();
                    requestAnimationFrame(() => {
                        window.print();
                    });
                };

                return {
                    markdownContent,
                    renderedHtml,
                    textareaRef,
                    previewRef,
                    fileInput,
                    openFile,
                    handleFileChange,
                    insertBold,
                    insertItalic,
                    insertCode,
                    handleKeydown,
                    exportPDF,
                };
            },
        });

        app.mount('#app');
    </script>
</body>
</html>
